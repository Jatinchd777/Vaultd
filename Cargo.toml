[package]
name = "vaultd"
version = "0.3.0"
edition = "2024"
description = "Encrypted vault for local dev secrets that exist only while you work."
license = "GPL-3.0-only"
repository = "https://github.com/Jatinchd777/Vaultd"
readme = "README.md"
keywords = ["secrets", "dotenv", "vault", "password-manager", "cli"]
categories = ["command-line-utilities"]
exclude = [".vaultd/"]

[lib]
name = "vaultd"
path = "src/lib.rs"
# Single test target: unit/doc scaffolds in src/ hold no tests —
# everything lives in tests/main.rs. Disabling them keeps `cargo test`
# to one runner with one summary line.
test = false
doctest = false

[[bin]]
name = "vaultd"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
libc = "0.2"
