[package]
name = "vaultd"
version = "0.1.0-beta.1"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
libc = "0.2"
